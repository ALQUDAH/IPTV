<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>IPTV Web App</title>
</head>
<body>
    <h1>Available Playlists</h1>
    <ul>
    {% for p in playlists %}
        <li><a href="{{ url_for('playlist', filename=p) }}">{{ p }}</a></li>
    {% else %}
        <li>No playlists found.</li>
    {% endfor %}
    </ul>
</body>
</html>
