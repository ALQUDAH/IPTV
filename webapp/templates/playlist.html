<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{ playlist }}</title>
</head>
<body>
    <h1>{{ playlist }}</h1>
    <ul>
    {% for c in channels %}
        <li><a href="{{ url_for('play') }}?url={{ c.url }}">{{ c.name }}</a></li>
    {% endfor %}
    </ul>
    <p><a href="{{ url_for('index') }}">Back to playlists</a></p>
</body>
</html>
